<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --x:#38bdf8; --o:#f472b6; --text:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  h1 { margin:0 0 8px; font-size:2.4rem; letter-spacing:1px; }
  .modes { display:flex; gap:8px; margin:12px 0; }
  .modes button, #reset { background:var(--card); color:var(--text); border:2px solid #334155; padding:8px 16px;
         border-radius:999px; cursor:pointer; font-size:0.95rem; }
  .modes button.active { border-color:var(--x); color:var(--x); }
  #status { font-size:1.3rem; margin:10px 0 16px; min-height:1.6em; }
  #board { display:grid; grid-template-columns:repeat(3, min(26vw,120px)); gap:10px; }
  .cell { aspect-ratio:1; background:var(--card); border:none; border-radius:16px; font-size:min(16vw,72px);
          font-weight:800; cursor:pointer; color:var(--text); transition:transform .1s, background .2s; }
  .cell:hover:not(:disabled) { background:#273449; transform:scale(1.03); }
  .cell.X { color:var(--x); } .cell.O { color:var(--o); }
  .cell.win { background:#334155; box-shadow:0 0 0 3px #facc15 inset; }
  .scores { display:flex; gap:24px; margin:18px 0; font-size:1rem; }
  .scores span b { font-size:1.4rem; display:block; text-align:center; }
  #reset { margin-top:4px; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div class="modes">
    <button id="pvp" class="active">2 Players</button>
    <button id="pvc">vs Computer</button>
  </div>
  <div id="status">X's turn</div>
  <div id="board"></div>
  <div class="scores">
    <span style="color:var(--x)">X<b id="sx">0</b></span>
    <span>Draws<b id="sd">0</b></span>
    <span style="color:var(--o)">O<b id="so">0</b></span>
  </div>
  <button id="reset">New Game</button>
<script>
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl=document.getElementById('board'), statusEl=document.getElementById('status');
  let board, turn, over, vsCpu=false; const score={X:0,O:0,D:0};
  const cells=[...Array(9)].map((_,i)=>{const b=document.createElement('button');b.className='cell';b.onclick=()=>play(i);boardEl.appendChild(b);return b;});
  function winner(b){for(const l of lines){const[a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return{p:b[a],l};}return b.every(Boolean)?{p:'D'}:null;}
  function reset(){board=Array(9).fill(null);turn='X';over=false;render();}
  function render(){cells.forEach((c,i)=>{c.textContent=board[i]||'';c.className='cell'+(board[i]?' '+board[i]:'');c.disabled=over||!!board[i];});
    const w=winner(board);
    if(w){over=true;cells.forEach(c=>c.disabled=true);
      if(w.p==='D')statusEl.textContent="It's a draw!";else{statusEl.textContent=w.p+' wins!';w.l.forEach(i=>cells[i].classList.add('win'));}}
    else statusEl.textContent=(vsCpu&&turn==='O')?'Computer is thinking…':turn+"'s turn";}
  function play(i){if(over||board[i]||(vsCpu&&turn==='O'))return;move(i);if(vsCpu&&!over)setTimeout(cpu,350);}
  function move(i){board[i]=turn;const w=winner(board);if(w){score[w.p]++;updScore();}turn=turn==='X'?'O':'X';render();}
  function updScore(){sx.textContent=score.X;so.textContent=score.O;sd.textContent=score.D;}
  function minimax(b,p){const w=winner(b);if(w)return{s:w.p==='O'?1:w.p==='X'?-1:0};
    let best={s:p==='O'?-2:2};
    b.forEach((v,i)=>{if(v)return;b[i]=p;const r=minimax(b,p==='O'?'X':'O');b[i]=null;
      if(p==='O'?r.s>best.s:r.s<best.s)best={s:r.s,i};});return best;}
  function cpu(){if(over)return;let i;
    // 20% of the time play a random move so it's beatable
    const free=board.map((v,i)=>v?null:i).filter(v=>v!==null);
    i=Math.random()<0.2?free[Math.floor(Math.random()*free.length)]:minimax(board.slice(),'O').i;move(i);}
  function setMode(c){vsCpu=c;pvp.classList.toggle('active',!c);pvc.classList.toggle('active',c);score.X=score.O=score.D=0;updScore();reset();}
  pvp.onclick=()=>setMode(false);pvc.onclick=()=>setMode(true);document.getElementById('reset').onclick=reset;
  reset();
</script>
</body>
</html>
